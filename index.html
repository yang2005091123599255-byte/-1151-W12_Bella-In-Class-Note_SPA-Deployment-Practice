<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BNA-EMI · W12 Class Notes</title>
<style>
:root{--ink:#1F2937;--muted:#6B7280;--line:#D9DEE5;--page:#FCFCFD;--soft:#F3F6FA;--surf:#fff;--arrow:#8A94A3;
--c1:#2E8B57;--c1b:#EEF8F1;--c1d:#A7D8B5;--c2:#2F6FB5;--c2b:#EEF4FD;--c2d:#A9C7EE;
--c3:#6A4FB3;--c3b:#F3F0FC;--c3d:#C5B8EE;--c4:#B7791F;--c4b:#FFF7E8;--c4d:#F0CF8E;
--c5:#0F7C80;--c5b:#ECF8F8;--c5d:#A6DADB;--c0:#4B5563;--c0b:#fff;--c0d:#D9DEE5;--tbc:#9A3412;--tbcb:#FFEDD5;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--ink:#E5E7EB;--muted:#9CA3AF;--line:#2F3744;--page:#0F141B;--soft:#161C25;--surf:#1B222D;--arrow:#7C8797;
--c1:#5CC48A;--c1b:#13251C;--c1d:#285B3D;--c2:#6AA5EC;--c2b:#13202F;--c2d:#2B4B72;
--c3:#A491E8;--c3b:#1D1830;--c3d:#43397A;--c4:#E3A73F;--c4b:#2A2113;--c4d:#6A4E1E;
--c5:#4FC3C7;--c5b:#11262A;--c5d:#25595C;--c0:#9CA3AF;--c0b:#1B222D;--c0d:#2F3744;--tbc:#FDBA74;--tbcb:#4A2A10;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--page);color:var(--ink);line-height:1.6;font-size:15px;
font-family:"Segoe UI",Helvetica,Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--soft);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--soft);border-bottom:1px solid var(--line);
display:flex;align-items:center;gap:8px;padding:8px 12px}
header .ttl{flex:1;min-width:0;text-align:center}
header h1{margin:0;font-size:20px;letter-spacing:.5px}
header p{margin:0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:999px;min-width:38px;height:38px;
padding:0 12px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.btn:hover{background:var(--soft)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,a:focus-visible{outline:2px solid var(--c2);outline-offset:2px}
.hr{display:flex;gap:6px}
/* drawer */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#drawer{position:fixed;top:0;left:0;bottom:0;width:min(300px,85vw);background:var(--surf);border-right:1px solid var(--line);z-index:50;
transform:translateX(-100%);transition:transform .22s;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 20px;overflow-y:auto;visibility:hidden}
body.open #drawer{transform:none;visibility:visible}body.open #scrim{opacity:1;pointer-events:auto}
#drawer h2{font-size:14px;color:var(--muted);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
#drawer .grp{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 4px}
#drawer a{display:block;text-decoration:none;font-size:14px;font-weight:600;color:var(--c);background:var(--bg);
border:1px solid var(--bd);border-radius:10px;padding:9px 12px;margin-top:6px}
#drawer a.on{background:var(--c);color:var(--page)}
/* content */
.wrap{width:100%;max-width:780px;margin:0 auto;padding:0 16px 24px;flex:1}
.c0{--c:var(--c0);--bg:var(--c0b);--bd:var(--c0d)}.c1{--c:var(--c1);--bg:var(--c1b);--bd:var(--c1d)}
.c2{--c:var(--c2);--bg:var(--c2b);--bd:var(--c2d)}.c3{--c:var(--c3);--bg:var(--c3b);--bd:var(--c3d)}
.c4{--c:var(--c4);--bg:var(--c4b);--bd:var(--c4d)}.c5{--c:var(--c5);--bg:var(--c5b);--bd:var(--c5d)}
.card{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-top:20px}
.sec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{background:var(--c);color:var(--page);font-weight:700;font-size:12px;border-radius:999px;padding:3px 10px;white-space:nowrap}
h2.pt{margin:0;font-size:21px}h3{margin:18px 0 8px;font-size:15px;color:var(--c)}
.lead{margin:8px 0 0}.sub{color:var(--muted);font-size:13px}.sub a{color:var(--c)}
.flow{list-style:none;display:flex;padding:0;margin:16px 0 4px}
.flow li{flex:1;position:relative;background:var(--surf);border:1px solid var(--bd);border-radius:10px;padding:12px 10px;text-align:center;min-width:0}
.flow li+li{margin-left:24px}
.flow li+li::before{content:"→";position:absolute;left:-19px;top:50%;transform:translateY(-50%);color:var(--arrow);font-weight:700}
.flow .n{display:inline-block;width:22px;height:22px;line-height:22px;border-radius:50%;background:var(--c);color:var(--page);font-size:12px;font-weight:700;margin-bottom:4px}
.flow strong{display:block;font-size:14px}.flow small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.flow li.key{border:2px solid var(--c)}
.grid{display:grid;gap:10px;margin-top:10px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.tile{background:var(--surf);border:1px solid var(--bd);border-radius:10px;padding:12px}
.tile strong{display:block;font-size:14px;margin-bottom:2px}.tile p{margin:0;font-size:13px;color:var(--muted)}
.tile ul{margin:4px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
code{background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:13px}
.callout{margin-top:14px;background:var(--surf);border-left:4px solid var(--c);border-radius:8px;padding:10px 14px;font-size:14px}
.status{margin-top:12px;background:var(--surf);border:1px dashed var(--arrow);border-radius:8px;padding:10px 14px;font-size:13px}
.tbc{display:inline-block;font-size:11px;font-weight:700;color:var(--tbc);background:var(--tbcb);border-radius:4px;padding:0 6px;margin-left:4px}
.market{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.market .tile{text-align:center;min-width:140px}.market .mid{font-size:13px;color:var(--muted);text-align:center}
.ov .grp{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surf)}
.ov .grp>span{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.ov a{display:block;text-decoration:none;font-size:13px;font-weight:600;color:var(--c);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;margin-top:6px}
/* pager */
.pager{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:24px;flex-wrap:wrap}
.pager .btn{height:42px;padding:0 16px}.pager .mid{order:0}
footer{background:var(--soft);border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:12px;padding:16px;line-height:1.8}
footer b{color:var(--ink)}
@media (max-width:640px){
header h1{font-size:17px}.btn{min-width:36px;height:36px;padding:0 10px}
.flow{flex-direction:column}
.flow li{text-align:left;display:grid;grid-template-columns:28px 1fr;column-gap:8px;align-items:start}
.flow li .n{grid-row:span 2;margin:0}.flow li small{margin-top:2px}
.flow li+li{margin-left:0;margin-top:22px}.flow li+li::before{content:"↓";left:50%;top:-20px;transform:translateX(-50%)}
.g2,.g3,.ov.grid{grid-template-columns:1fr}.card{padding:16px}
.pager{display:grid;grid-template-columns:1fr 1fr}.pager .mid{grid-column:1/-1;order:3}
}
@media print{header,.pager,#drawer,#scrim{display:none}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}#drawer,#scrim{transition:none}}
</style>
</head>

  <button class="btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="drawer">☰</button>

<script>
const L=(e,z)=>({en:e,zh:z});
const UI={
 sub:L("Business Analysis · W12 Class Notes (1151-W12) · AY 115, Sem. 1","商業分析 · W12 課堂筆記 (1151-W12) · 115 學年度第 1 學期"),
 menu:L("Modules","單元選單"),close:L("Close","關閉"),

};
const VERSION="1.0.0",YEAR="2026",NAME=L("Prof. Shihmin Lo","Shihmin Lo 教授");
const T=(a,b)=>L(a,b);
const P=[
{id:"overview",c:"c0",grp:null,title:L("Overview","總覽"),
 lead:L("The parts are connected, but they are not one single sequence. Parts 1–2 are ways of thinking. Part 3 applies them to content. Parts 4–5 apply them to product development.","各部分彼此相關，但並非單一順序。第 1–2 部分是思考方式，第 3 部分將其應用於內容處理，第 4–5 部分則應用於產品開發。"),
 b:[{t:"ov"}]},
{id:"p1",c:"c1",grp:"g1",badge:L("PART 1","第 1 部分"),title:L("Analytical Thinking","分析性思考"),
 lead:L("Break a problem into parts, investigate each part with evidence, recombine the parts, and draw new insights.","將問題拆解成各部分，以證據逐一深入探究，再重新組合，進而得出新的洞見。"),
 b:[{t:"flow",key:3,i:[[L("Separate","拆解"),L("Break the issue into parts: the problem, the demand and the questions.","將議題拆成各部分：問題、需求與疑問。")],
  [L("Investigate Deeply","深入探究"),L("Examine each part with evidence and look for potential relationships.","以證據檢視每個部分，並尋找潛在關聯。")],
  [L("Recombine","重新組合"),L("Bring the parts back together into a systematic understanding.","將各部分整合為有系統的理解。")],
  [L("Insights","洞見"),L("New perspectives that come out of the analysis.","分析所產生的新觀點。")]]},
  {t:"call",h:L("Critical Thinking","批判性思考"),x:L(" underpins the whole process: question the problem, the evidence and the conclusions instead of accepting them at face value."," 貫穿整個過程：對問題、證據與結論提出質疑，而非照單全收。")}]},
{id:"p2",c:"c2",grp:"g1",badge:L("PART 2","第 2 部分"),title:L("Knowledge Representation","知識表達"),
 lead:L("Present what you have learned in a form that is easy to follow, for example a Coggle mind map.","將所學以易於理解的形式呈現，例如 Coggle 心智圖。"),
 b:[{t:"grid",n:3,h:L("Coggle Mind Map: three key qualities","Coggle 心智圖：三項關鍵特質"),i:[
  [L("Systematic","系統性"),L("Covers the topic as a whole, with nothing left in isolation.","完整涵蓋主題，沒有孤立的部分。")],
  [L("Structured","結構化"),L("Ideas are organized into a clear hierarchy of main and sub-topics.","想法依主題與子題分成清楚的層級。")],
  [L("Process-oriented","流程導向"),L("Shows how ideas lead from one step to the next.","呈現想法如何由一步通往下一步。")]]},
  {t:"grid",n:2,h:L("Effectiveness vs Efficiency: two different measures","效果與效率：兩種不同的衡量"),i:[
  [L("Effectiveness","效果 (Effectiveness)"),L("Were the original goals and objectives achieved?","原本的目標與目的是否達成？")],
  [L("Efficiency","效率 (Efficiency)"),L("What is the relationship between input and output?","投入與產出之間的關係為何？")]]},
  {t:"sub",x:L("Assess the two separately. One does not imply the other.","兩者應分開評估，一方不代表另一方。")}]},
{id:"p3",c:"c3",grp:"g2",badge:L("PART 3","第 3 部分"),title:L("AI Task Agent & Content Processing","AI 任務代理與內容處理"),
 lead:L("An AI task agent can help analyze, organize and summarize class content.","AI 任務代理可協助分析、整理並摘要課堂內容。"),
 b:[{t:"flow",key:1,i:[[L("Input","輸入"),L("Notes, recordings, images","筆記、錄音、圖片")],[L("AI Task Agent","AI 任務代理"),L("Receives the task","接收任務")],
  [L("Analysis","分析"),L("Analyzes and organizes","分析並整理")],[L("Summary","摘要"),L("Condenses key points","濃縮重點")],[L("Output","輸出"),L("Summary, insights, files","摘要、洞見、檔案")]]},
  {t:"grid",n:2,i:[[L("Input","輸入"),[L("In-class handwritten notes","課堂手寫筆記"),L("Voice recordings","語音錄音"),L("Images / pictures","圖片／照片")]],
  [L("Output","輸出"),[L("Summary","摘要"),L("Insights","洞見"),L("Markdown files (.md)","Markdown 檔案 (.md)"),L("Documents","文件")]]]}]},
{id:"p4",c:"c4",grp:"g3",badge:L("PART 4","第 4 部分"),title:L("PRD → MVP → Product","PRD → MVP → 產品"),
 lead:L("The PRD comes early. It defines what to build before the MVP is developed.","PRD 在早期就出現，先定義要做什麼，再開發 MVP。"),
 b:[{t:"flow",key:1,i:[[L("Problem / Demand","問題／需求"),L("What needs solving","需要解決什麼")],[L("PRD","PRD"),L("Requirements, functions, specs","需求、功能、規格")],
  [L("MVP","MVP"),L("Minimum viable product","最小可行產品")],[L("Product","產品"),L("Improved step by step","逐步改善")],[L("Website","網站"),L("One way to present it","呈現方式之一")]]},
  {t:"grid",n:2,i:[[L("PRD · Product Requirements Document","PRD · 產品需求文件"),L("Describes the product’s requirements, functions and specifications.","描述產品的需求、功能與規格。")],
  [L("MVP · Minimum Viable Product","MVP · 最小可行產品"),L("The simplest version of the product that still works.","仍可運作的最精簡版本。")],
  [L("Product","產品"),L("Software, an app or an application, refined over time. The whiteboard writes this as “Tp” = Product.","軟體、App 或應用程式，並持續改進。白板上寫作「Tp」＝ Product。"),1],
  [L("Website","網站"),L("One way of presenting the product or service.","呈現產品或服務的方式之一。")]]},
  {t:"link",x:L("The market side of product development continues in ","產品開發的市場面向將於 "),l:L("Part 5","第 5 部分"),y:L("."," 繼續說明。"),to:"p5"}]},
{id:"p5",c:"c5",grp:"g3",badge:L("PART 5","第 5 部分"),title:L("Webpage, Deployment & Market","網頁、部署與市場"),
 lead:L("How the product is built, delivered and taken to market.","產品如何建置、交付並推向市場。"),
 b:[{t:"grid",n:3,h:L("Three separate components","三個獨立組件"),i:[
  [L("Front-end","前端"),L("The web interface that users see and interact with.","使用者所見並互動的網頁介面。")],
  [L("Back-end","後端"),L("Handles data, computation and other server-side functions.","處理資料、運算與其他伺服器端功能。")],
  [L("AI Agent","AI 代理"),L("Performs specific analysis, organizing or task execution.","執行特定的分析、整理或任務。")]]},
  {t:"status",h:L("Current status:","目前狀態："),x:L(" this page is a static front-end only. No back-end or live AI agent is connected. The BNA Agent is a possible development direction, and its exact role is still to be confirmed."," 本頁僅為靜態前端，尚未連接後端或即時 AI 代理。BNA Agent 是可能的發展方向，其確切角色仍待確認。")},
  {t:"flow",key:3,h:L("From webpage to market (potential direction)","從網頁到市場（潛在方向）"),i:[[L("Webpage Service","網頁服務"),L("Deployed online","部署上線")],[L("Potential SaaS","潛在 SaaS"),L("Software as a Service","軟體即服務")],
  [L("Commercialization","商業化"),L("Offered commercially","以商業方式提供")],[L("Market","市場"),L("Where transactions happen","交易發生之處")]]},
  {t:"market",h:L("Market relationship","市場關係"),a:[L("Producers","生產者"),L("Offer the product or service","提供產品或服務")],m:L("transaction","交易"),z:[L("Consumers","消費者"),L("Buy when they see value","看見價值時購買")]},
  {t:"call",h:L("Value (WTP):","價值 (WTP)："),x:L(" willingness to pay, which is what consumers are prepared to pay for the value they receive."," 願付價格 (Willingness To Pay)，即消費者為所獲得的價值願意支付的金額。")}]}
];
let lang="en",theme="light",cur=0;
const $=s=>document.querySelector(s),tx=o=>o[lang];
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const E=o=>esc(tx(o));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

function flow(b){return(b.h?`<h3>${E(b.h)}</h3>`:"")+`<ol class="flow">`+b.i.map((x,i)=>`<li${i===b.key?' class="key"':""}><span class="n">${i+1}</span><strong>${E(x[0])}</strong><small>${E(x[1])}</small></li>`).join("")+`</ol>`}
function tile(x){const body=Array.isArray(x[1])?`<ul>${x[1].map(y=>`<li>${E(y)}</li>`).join("")}</ul>`:`<p>${E(x[1])}${x[2]?`<span class="tbc">${E(UI.tbc)}</span>`:""}</p>`;return`<div class="tile"><strong>${E(x[0])}</strong>${body}</div>`}
function block(b){switch(b.t){
 case"flow":return flow(b);
 case"grid":return(b.h?`<h3>${E(b.h)}</h3>`:"")+`<div class="grid g${b.n}">${b.i.map(tile).join("")}</div>`;
 case"call":return`<div class="callout"><strong>${E(b.h)}</strong>${E(b.x)}</div>`;
 case"status":return`<div class="status"><strong>${E(b.h)}</strong>${E(b.x)}</div>`;
 case"sub":return`<p class="sub">${E(b.x)}</p>`;
 case"link":return`<p class="sub">${E(b.x)}<a href="#${b.to}">${E(b.l)}</a>${E(b.y)}</p>`;
 case"market":return`<h3>${E(b.h)}</h3><div class="market"><div class="tile"><strong>${E(b.a[0])}</strong><p>${E(b.a[1])}</p></div><div class="mid">⇄<br>${E(b.m)}</div><div class="tile"><strong>${E(b.z[0])}</strong><p>${E(b.z[1])}</p></div></div>`;
 case"ov":return`<div class="grid g3 ov">`+["g1","g2","g3"].map(g=>`<div class="grp"><span>${E(UI[g])}</span>`+P.filter(p=>p.grp===g).map(p=>`<a class="${p.c}" href="#${p.id}">${E(p.badge)} · ${E(p.title)}</a>`).join("")+`</div>`).join("")+`</div>`}}

function render(){
  const p=P[cur];document.documentElement.lang=lang==="zh"?"zh-Hant":"en";
  document.title=`BNA-EMI · ${tx(p.title)}`;
  $("#app").innerHTML=`<section class="card ${p.c}" aria-labelledby="pt"><div class="sec-head">${p.badge?`<span class="badge">${E(p.badge)}</span>`:""}<h2 class="pt" id="pt">${E(p.title)}</h2></div><p class="lead">${E(p.lead)}</p>${p.b.map(block).join("")}</section>
  <nav class="pager" aria-label="Pager"><button class="btn" id="prev" type="button" ${cur===0?"disabled":""}>${E(UI.prev)}</button><button class="btn mid" id="top" type="button">${E(UI.top)}</button><button class="btn" id="next" type="button" ${cur===P.length-1?"disabled":""}>${E(UI.next)}</button></nav>`;
  $("#prev").onclick=()=>go(cur-1);$("#next").onclick=()=>go(cur+1);
  $("#top").onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
  let d=`<h2><span>${E(UI.menu)}</span><button class="btn" id="cls" type="button" aria-label="${E(UI.close)}">✕</button></h2>`,last="";
  P.forEach((q,i)=>{if(q.grp&&q.grp!==last){last=q.grp;d+=`<div class="grp">${E(UI[q.grp])}</div>`}
    d+=`<a class="${q.c}${i===cur?" on":""}" href="#${q.id}"${i===cur?' aria-current="page"':""}>${q.badge?E(q.badge)+" · ":""}${E(q.title)}</a>`});
  $("#drawer").innerHTML=d;$("#cls").onclick=()=>menu(false);
  document.querySelector("[data-i=sub]").textContent=tx(UI.sub);
  $("#langBtn").textContent=lang==="en"?"中文":"EN";$("#langBtn").setAttribute("aria-label",lang==="en"?"切換為繁體中文":"Switch to English");
  $("#themeBtn").textContent=theme==="dark"?"☀":"☾";$("#themeBtn").setAttribute("aria-label",theme==="dark"?"Light mode":"Dark mode");
  $("#foot").innerHTML=`<div><b>${E(UI.arch)}: ${E(NAME)}</b> · ${E(UI.ver)} ${VERSION}</div><div>© ${YEAR} ${E(NAME)}. ${E(UI.rights)}</div><div>${E(UI.src)}</div>`;
}
function go(i){if(i<0||i>=P.length)return;location.hash=P[i].id}
function route(){const id=location.hash.slice(1);const i=P.findIndex(p=>p.id===id);cur=i<0?0:i;menu(false);render();window.scrollTo(0,0);$("#app").focus({preventScroll:true})}
function menu(o){document.body.classList.toggle("open",o);$("#menuBtn").setAttribute("aria-expanded",o);$("#drawer").setAttribute("aria-hidden",!o)}
function setTheme(t){theme=t;document.documentElement.dataset.theme=t;store.set("bna-theme",t)}
$("#menuBtn").onclick=()=>menu(!document.body.classList.contains("open"));
$("#scrim").onclick=()=>menu(false);
document.addEventListener("keydown",e=>{if(e.key==="Escape")menu(false)});
$("#langBtn").onclick=()=>{lang=lang==="en"?"zh":"en";store.set("bna-lang",lang);render()};
$("#themeBtn").onclick=()=>{setTheme(theme==="dark"?"light":"dark");render()};
window.addEventListener("hashchange",route);
lang=store.get("bna-lang")||((navigator.language||"").toLowerCase().startsWith("zh")?"zh":"en");
setTheme(store.get("bna-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
route();
</script>
</body>
</html>
